services:
  postgres:
    image: postgres:alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql

  pgweb:
    image: ghcr.io/sosedoff/pgweb:latest
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      - PGWEB_DATABASE_URL=postgres://postgres:postgres@postgres:5432/ecommerce?sslmode=disable
    depends_on:
      - postgres

  # Local SMTP sink — the target of the backend's default development
  # transport.
  #
  # `SmtpEmailService` renders the same HTML the Resend transport sends and
  # hands it here, so a password reset can be read in a browser at
  # http://localhost:8025 instead of being copied out of a log line. Mailpit
  # keeps messages in memory and never delivers, which is what makes it safe as
  # a default: nothing can escape the machine.
  #
  # No environment variable is required. EMAIL_TRANSPORT defaults to "smtp" in
  # development, and SMTP_HOST/SMTP_PORT default to localhost:1025, which is
  # where this publishes. The backend runs on the host (not in Compose), so the
  # host address is `localhost` — inside a Compose network it would be
  # `mailpit`.
  #
  # Set EMAIL_TRANSPORT=console to bypass it and log instead.
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - '8025:8025' # web UI
      - '1025:1025' # SMTP
    environment:
      # Keep messages in memory only; nothing on this box needs them to survive
      # a restart, and it avoids an anonymous volume nobody reaps.
      MP_MAX_MESSAGES: '500'
      MP_SMTP_AUTH_ACCEPT_ANY: '1'
      MP_SMTP_AUTH_ALLOW_INSECURE: '1'

  postgres-test:
    image: postgres:alpine
    restart: "no"
    profiles:
      - test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecommerce_test"]
      interval: 2s
      timeout: 3s
      retries: 5

volumes:
  postgres_data: