name: CI
on: pull_request
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: ecom_test
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6

      # Local-only files must never enter the repo. This reads .gitignore
      # directly rather than checking a hardcoded list, so it covers any path
      # the owner excludes — including ones added after this workflow was
      # written. Mirrors the pre-commit `guard-ignored-tracked` hook.
      - name: Guard local-only files
        run: |
          leaked=$(git ls-files -i -c --exclude-standard)
          if [ -n "$leaked" ]; then
            echo "::error::Tracked files are gitignored and must not be committed:"
            echo "$leaked"
            exit 1
          fi

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm biome check --no-errors-on-unmatched backend/src backend/test frontend shared biome.json lefthook.yml
      - run: pnpm --filter backend build
      - run: pnpm --filter backend test:cov
        env:
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USER: test
          DATABASE_PASSWORD: test
          DATABASE_NAME: ecom_test

